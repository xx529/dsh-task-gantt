# dsh-task-gantt bundle patch
#
# This is the `dsh.bundle.patch` layer of the published package: when the plugin
# is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-task-gantt
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-task-gantt` to the bundle stack, so
# the profile boot merges this single `insert` of the plugin row. No profile
# file edits are needed.
#
# The host half is a no-op unless `ctx.webServer` exists, and the client half
# only registers its sidebar tab when `ctx.betterSidebar` is present, so
# mounting this row in a profile without dsh-better-sidebar is harmless.
- insert:
    - id: dsh-task-gantt
      name: 'dsh-task-gantt'
